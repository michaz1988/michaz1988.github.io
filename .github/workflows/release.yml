name: EPG und Listen aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: daily-epg-release
  cancel-in-progress: false

jobs:
  update:
    name: EPG, Listen und Logos erzeugen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .epg/requirements.txt

      - name: Abhängigkeiten installieren
        run: python -m pip install --requirement .epg/requirements.txt

      - name: Logos aktualisieren
        run: python .epg/make_logos.py --output-dir .

      - name: Logo-Änderungen veröffentlichen
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvs-logos tvsp.md5
          if git diff --cached --quiet; then
            echo "Keine Logo-Änderungen vorhanden."
          else
            git commit -m "TV-Spielfilm-Logos aktualisieren"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: EPG erzeugen
        run: python .epg/make_guide.py --output-dir . --days 3

      - name: MAC- und Xtream-Listen erzeugen
        run: python .epg/make_lists.py --output-dir .

      - name: Ausgaben prüfen
        run: python .epg/validate_outputs.py --output-dir .

      - name: Release-Dateien veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view EPG >/dev/null 2>&1; then
            gh release create EPG --title "DAILY EPG" --notes "Automated daily EPG update."
          fi
          gh release upload EPG \
            guide.xml \
            guide.xml.gz \
            maclist.json \
            xtreamlist.json \
            --clobber
